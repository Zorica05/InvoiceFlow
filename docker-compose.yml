services:
  db:
    image: postgres:16
    container_name: invoiceflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoiceflow
      POSTGRES_PASSWORD: invoiceflow
      POSTGRES_DB: invoiceflow
    ports:
      - "5433:5432"
    volumes:
      - invoiceflow_data:/var/lib/postgresql/data

volumes:
  invoiceflow_data:
